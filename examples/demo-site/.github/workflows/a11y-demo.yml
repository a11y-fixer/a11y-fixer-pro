name: a11y-fixer demo

# Opens a PR with accessibility fixes. Run it by hand from the Actions tab
# (Run workflow), or let it fire on push to main. Fix mode never touches main —
# it opens a throwaway PR — so the broken site stays broken and the demo is
# infinitely repeatable. To reset: close the PR and delete its branch, or just
# re-run (the fix branch is force-updated).
on:
  workflow_dispatch:
  push:
    branches: [main]

# The Action needs to push the fix branch and open a PR.
permissions:
  contents: write
  pull-requests: write

jobs:
  # Static-HTML path (axe-core). Surfaces image-alt (1.1.1), link-name (2.4.4),
  # button-name (4.1.2) and label (1.3.1) — four auto-applied fixes.
  html-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Persist the AI cache across runs so repeated demos don't re-spend on
      # Anthropic. Keyed on the HTML source so it's reused until the site changes.
      - uses: actions/cache@v4
        with:
          path: .a11y-fixer-cache.json
          key: a11y-fixer-ai-html-${{ hashFiles('site-html/**') }}

      - uses: a11y-fixer/a11y-fixer-pro@v1
        with:
          mode: fix
          dir: site-html
          html: 'true'
          base-branch: main
          license-key: ${{ secrets.A11Y_FIXER_LICENSE_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-file: .a11y-fixer-cache.json

  # Default JSX path (ESLint + jsx-a11y). Surfaces alt-text (1.1.1, auto-fixed)
  # and anchor-has-content (2.4.4), which LinkTextFixer human-flags in the PR.
  jsx-demo:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/cache@v4
        with:
          path: .a11y-fixer-cache.json
          key: a11y-fixer-ai-jsx-${{ hashFiles('site-jsx/**') }}

      - uses: a11y-fixer/a11y-fixer-pro@v1
        with:
          mode: fix
          dir: site-jsx
          base-branch: main
          license-key: ${{ secrets.A11Y_FIXER_LICENSE_KEY }}
          anthropic-api-key: ${{ secrets.ANTHROPIC_API_KEY }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          cache-file: .a11y-fixer-cache.json
