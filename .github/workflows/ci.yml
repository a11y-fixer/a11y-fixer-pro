name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # pnpm/action-setup reads the version from the root package.json
      # "packageManager" field, keeping CI and local in sync.
      - uses: pnpm/action-setup@73e46992e05b19abd31f2f3c20e0e7370d762115 # v6.1.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - run: pnpm -r run build

      # Coverage thresholds live in each package's vitest.config.ts, so this
      # step fails the build on any regression below the gate.
      - run: pnpm -r run coverage

      # The committed action bundle must match source — rebuild and fail if the
      # checked-in dist is stale.
      - name: Verify github-action bundle is up to date
        run: |
          pnpm --filter @a11y-fixer/github-action run build
          if ! git diff --quiet -- packages/github-action/dist; then
            echo "::error::packages/github-action/dist is out of date. Run 'pnpm --filter @a11y-fixer/github-action run build' and commit."
            git --no-pager diff --stat -- packages/github-action/dist
            exit 1
          fi

  # Runs the committed bundle the way a consumer's workflow does — isolated, no
  # workspace node_modules on the resolution path — so the createRequire()
  # runtime deps that ncc can't bundle must actually be installed. Deliberately
  # does NOT run `pnpm install`, which would leak the workspace node_modules and
  # mask the exact failure this guards against.
  action-bundle:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 20

      - name: Run committed action bundle in isolation
        env:
          # The private license-signing key mints keys, so it is the single most
          # sensitive secret in the product. Only expose it on trusted events
          # (push to main, release) — NEVER on pull_request, which includes
          # same-repo PR branches a compromised collaborator could push. On PRs
          # the key is empty and test-action-bundle.sh soft-skips the mint step
          # while still exercising the rest of the bundle. The full path runs on
          # push to main after merge. Harden further by moving the secret into a
          # GitHub Environment with required reviewers.
          LICENSE_SIGNING_KEY: ${{ github.event_name != 'pull_request' && secrets.LICENSE_SIGNING_KEY || '' }}
        run: bash scripts/test-action-bundle.sh
